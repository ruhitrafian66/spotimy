name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: scripts/bundle-macos.sh
      - run: ditto -c -k --keepParent dist/Spotimy.app Spotimy-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Spotimy-macos-arm64
          path: Spotimy-macos-arm64.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: Spotimy-windows-x64
          path: target/release/spotimy.exe
